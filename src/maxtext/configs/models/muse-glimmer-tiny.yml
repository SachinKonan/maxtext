# Tiny random-weight Muse-Glimmer used by the CPU HF-parity harness. Keeps the
# [S,S,S,F] layer pattern (one full cycle) so both attention types and the NoPE
# layers are exercised, and keeps every non-shape constant identical to the 30B.

decoder_block: "muse_glimmer"

base_num_decoder_layers: 4
base_emb_dim: 256
base_num_query_heads: 4
base_num_kv_heads: 1
head_dim: 64
base_mlp_dim: 512
mlp_activations: ["silu", "linear"]
vocab_size: 512

normalization_layer_epsilon: 1.e-05
post_norm_layer_epsilon: 1.e-08

inhomogeneous_layer_cycle_interval: 4
sliding_window_size: 8
attention_bias: false
use_qk_norm: true
qk_norm_with_scale: false
qk_scale_factor: 3.87

rope_type: "default"
rope_max_timescale: 500000
max_position_embeddings: 4096

logits_via_embedding: false
normalize_embedding_logits: false
logits_output_multiplier: 0.19611613513818404
final_logits_soft_cap: 20.0
